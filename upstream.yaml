# vyges-yosys build pin — the source of truth for what we build.
#
# Self-contained: CI clones Yosys at `commit` (recursively — abc submodule) and
# BUILDS it. Yosys runs a continuous-master model with periodic tags, so we pin the
# exact commit for reproducibility (like OpenROAD). A sync workflow bumps it via PR.
upstream:
  source: https://github.com/YosysHQ/yosys
  ref: master
  release_tag: "0.66"                                  # human-facing; commit is authoritative
  commit: "86f2ddebc"                                  # yosys 0.66 (short; CI resolves full sha)
  recurse_submodules: true                             # abc + friends
  updated_at: "2026-07-17T00:00:00Z"

license:
  spdx: ISC                                            # Yosys; shipped with the bundle as LICENSE.yosys

build:
  base_image: ubuntu:24.04
  configure: "make config-gcc"
  compile: "make -j"
