name: release

# De-facto Vyges multi-arch build: native per-arch builds + DIGEST-based manifest
# merge -> clean tags only (:sha-<short> / :<version> / :latest, multi-arch).
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 0.66)"
        required: true

permissions:
  contents: write
  packages: write

env:
  IMG: ghcr.io/vyges-tools/vyges-yosys

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-${{ vars.VYGES_UBUNTU_VERSION || '24.04' }}
            arch: x86_64
            docker_arch: amd64
          - runner: ubuntu-${{ vars.VYGES_UBUNTU_VERSION || '24.04' }}-arm
            arch: aarch64
            docker_arch: arm64
    runs-on: ${{ matrix.runner }}
    name: build-${{ matrix.arch }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - name: Read pin
        id: pin
        run: |
          C=$(grep -E '^[[:space:]]*commit:' upstream.yaml | head -1 | sed -E 's/.*commit:[[:space:]]*//; s/[[:space:]]*#.*//; s/"//g')
          echo "commit=$C" >> "$GITHUB_OUTPUT"
      - name: Install build deps
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            build-essential bison flex libfl-dev libreadline-dev gawk tcl-dev libffi-dev git \
            pkg-config python3 zlib1g-dev libboost-system-dev libboost-filesystem-dev cmake swig libeigen3-dev autoconf automake libtool
      - name: Clone Yosys (recursive)
        run: |
          git clone --recursive https://github.com/YosysHQ/yosys /tmp/yosys
          git clone https://github.com/parallaxsw/OpenSTA /tmp/opensta
      - name: Build bundle + tarball (arch from uname -m)
        id: bb
        env:
          YOSYS_COMMIT: ${{ steps.pin.outputs.commit }}
          VERSION: ${{ inputs.version }}
          OUT_DIR: ${{ github.workspace }}/dist
          YOSYS_TREE: /tmp/yosys
        run: |
          bash scripts/build-bundle.sh | tee /tmp/bb.log
          echo "short=$(grep -oE 'short=[0-9a-f]+' /tmp/bb.log | head -1 | cut -d= -f2)" >> "$GITHUB_OUTPUT"
      - name: Smoke
        run: bash scripts/smoke.sh "dist/vyges-yosys-${{ inputs.version }}-g${{ steps.bb.outputs.short }}"
      - name: Upload tarball
        uses: actions/upload-artifact@v7
        with:
          name: tarball-${{ matrix.arch }}
          path: dist/*.tar.gz
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build + push image BY DIGEST
        env:
          VERSION: ${{ inputs.version }}
          SHORT: ${{ steps.bb.outputs.short }}
          DA: ${{ matrix.docker_arch }}
        run: |
          docker buildx build -f Dockerfile.runtime \
            --build-arg BUNDLE_DIR="vyges-yosys-${VERSION}-g${SHORT}" \
            --build-arg VERSION="${VERSION}" \
            --platform "linux/${DA}" --provenance=false \
            --output "type=image,name=${IMG},push-by-digest=true,name-canonical=true,push=true" \
            --metadata-file /tmp/meta.json dist
          DIGEST=$(jq -r '."containerimage.digest"' /tmp/meta.json)
          mkdir -p /tmp/digests && touch "/tmp/digests/${DIGEST#sha256:}"
          echo "SHORT=${SHORT}" > /tmp/short.env
      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
      - name: Upload short marker
        if: matrix.arch == 'x86_64'
        uses: actions/upload-artifact@v7
        with: { name: short, path: /tmp/short.env }

  publish:
    needs: build
    runs-on: ubuntu-${{ vars.VYGES_UBUNTU_VERSION || '24.04' }}
    steps:
      - uses: actions/download-artifact@v8
        with: { path: dist, pattern: tarball-*, merge-multiple: true }
      - uses: actions/download-artifact@v8
        with: { path: /tmp/digests, pattern: digest-*, merge-multiple: true }
      - uses: actions/download-artifact@v8
        with: { name: short, path: /tmp }
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create multi-arch manifests from digests
        env:
          VERSION: ${{ inputs.version }}
        run: |
          source /tmp/short.env
          SRCS=$(for f in /tmp/digests/*; do echo -n "${IMG}@sha256:$(basename "$f") "; done)
          for TAG in "sha-${SHORT}" "${VERSION}" latest; do
            docker buildx imagetools create -t "${IMG}:${TAG}" $SRCS
          done
          docker buildx imagetools inspect "${IMG}:${VERSION}"
      - name: Publish GitHub Release (both-arch tarballs)
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ inputs.version }}
          name: vyges-yosys ${{ inputs.version }}
          body: |
            Yosys ${{ inputs.version }}, reproducibly built by Vyges.
            **Multi-arch: linux/amd64 + linux/arm64** (native builds, digest-based manifest).
            - Tarballs: `…-linux-x86_64.tar.gz` / `…-linux-aarch64.tar.gz` — `source env.sh` then `yosys`.
            - Image: `ghcr.io/vyges-tools/vyges-yosys:${{ inputs.version }}` (multi-arch manifest).
            Yosys is ISC-licensed (LICENSE.yosys in the bundle); repo tooling Apache-2.0.
          files: dist/*.tar.gz
